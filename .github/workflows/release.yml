name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  BINARY_NAME: evm-benchmark

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            cross: true
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install Cargo Steward v0.2.0
        if: runner.os != 'Windows'
        shell: bash
        run: |
          installer="$RUNNER_TEMP/install-cargo-steward.sh"
          curl --fail --silent --show-error --location --retry 3 https://raw.githubusercontent.com/0xdoublesharp/cargo-steward/v0.2.0/scripts/install.sh -o "$installer"
          sh "$installer" --release 0.2.0 --repo 0xdoublesharp/cargo-steward --no-setup
          echo "${CARGO_HOME:-$HOME/.cargo}/bin" >> "$GITHUB_PATH"
          if [[ -n "${RUSTC_WRAPPER:-}" && "$RUSTC_WRAPPER" != cargo-steward ]]; then
            printf 'CARGO_STEWARD_INNER=%s\n' "$RUSTC_WRAPPER" >> "$GITHUB_ENV"
          fi
          echo "RUSTC_WRAPPER=cargo-steward" >> "$GITHUB_ENV"
      - name: Track Cargo build cache
        if: runner.os != 'Windows'
        uses: 0xdoublesharp/cargo-steward@v0.2.0
        with:
          mode: start
      - name: Install cross
        if: matrix.cross
        run: cargo install cross --locked

      - name: Build release binary
        env:
          # The host wrapper is not installed in cross's build container.
          RUSTC_WRAPPER: ${{ matrix.cross && '' || 'cargo-steward' }}
        run: ${{ matrix.cross && 'cross' || 'cargo' }} build --release --target ${{ matrix.target }} -p evm-benchmark

      - name: Package artifact
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          cd "target/${{ matrix.target }}/release"
          tar czf "../../../${BINARY_NAME}-${tag}-${{ matrix.target }}.tar.gz" "${BINARY_NAME}"
          cd ../../..

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: ${{ env.BINARY_NAME }}-*-${{ matrix.target }}.tar.gz
      - name: Trim Cargo build cache
        if: runner.os != 'Windows'
        uses: 0xdoublesharp/cargo-steward@v0.2.0
        with:
          mode: trim
          budget: 4GiB

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: "*.tar.gz"

  publish-npm:
    name: Publish to npm
    needs: release
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 26.12.1
          registry-url: https://registry.npmjs.org

      - name: Sync package version with release tag
        working-directory: npm/evm-benchmark
        run: npm pkg set version="${GITHUB_REF_NAME#v}"

      - name: Publish @0xdiesis/evm-benchmark
        working-directory: npm/evm-benchmark
        run: npm publish --access public --provenance
