name: Setup forge-ds
description: Build and cache the exact Diesis Foundry fork revision

runs:
  using: composite
  steps:
    - name: Setup pinned Rust for forge-ds
      uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
      with:
        toolchain: 1.97.1

    - name: Restore forge-ds binary
      id: forge-ds-cache
      uses: actions/cache@v5
      with:
        path: ~/.cargo/bin/forge-ds
        key: forge-ds-${{ runner.os }}-${{ runner.arch }}-rust-1.97.1-319852a15c4b92b34d3434fa997f476877545cf9

    - name: Setup sccache for forge-ds build
      if: steps.forge-ds-cache.outputs.cache-hit != 'true'
      uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba
      with:
        version: v0.17.0

    - name: Build forge-ds from the pinned source revision
      if: steps.forge-ds-cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        RUSTC_WRAPPER: sccache
        SCCACHE_GHA_ENABLED: "true"
      run: cargo +1.97.1 install --git https://github.com/doublesharp/foundry.git --rev 319852a15c4b92b34d3434fa997f476877545cf9 --locked --bin forge-ds --features forge-ds forge

    - name: Verify forge-ds revision
      shell: bash
      run: |
        set -euo pipefail
        version="$(forge-ds --version)"
        printf '%s\n' "$version"
        grep -F "Commit SHA: 319852a15c4b92b34d3434fa997f476877545cf9" <<<"$version"
