name: Setup forge-ds
description: Install the pinned Diesis Foundry fork revision, preferring its prebuilt release binary

runs:
  using: composite
  steps:
    - name: Restore forge-ds binary
      id: forge-ds-cache
      uses: actions/cache@v5
      with:
        path: ~/.cargo/bin/forge-ds
        key: forge-ds-${{ runner.os }}-${{ runner.arch }}-rust-1.97.1-6975c33c48e438d986fe90c7d6c0c5502f1235ed

    # The prebuilt binary is used only when its checksum matches and it reports
    # the pinned commit; otherwise the pinned revision is built from source below.
    - name: Install prebuilt forge-ds
      id: prebuilt
      if: steps.forge-ds-cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        FORGE_DS_REVISION: 6975c33c48e438d986fe90c7d6c0c5502f1235ed
      run: |
        set -euo pipefail
        # Each fork build publishes an immutable release tagged with its short commit.
        release_url="https://github.com/doublesharp/foundry/releases/download/forge-ds-${FORGE_DS_REVISION:0:7}"
        case "${RUNNER_OS}-${RUNNER_ARCH}" in
          Linux-X64) platform=linux_amd64 ;;
          Linux-ARM64) platform=linux_arm64 ;;
          macOS-ARM64) platform=darwin_arm64 ;;
          *) echo "::notice::No prebuilt forge-ds for ${RUNNER_OS}-${RUNNER_ARCH}"; exit 0 ;;
        esac
        archive="forge-ds_${platform}.tar.gz"
        work="$(mktemp -d)"
        if ! curl -fsSL --retry 3 -o "$work/$archive" "$release_url/$archive" \
          || ! curl -fsSL --retry 3 -o "$work/$archive.sha256" "$release_url/$archive.sha256"; then
          echo "::notice::Prebuilt forge-ds is unavailable; building from source"
          exit 0
        fi
        expected="$(cut -d ' ' -f 1 "$work/$archive.sha256")"
        if command -v sha256sum >/dev/null; then
          actual="$(sha256sum "$work/$archive" | cut -d ' ' -f 1)"
        else
          actual="$(shasum -a 256 "$work/$archive" | cut -d ' ' -f 1)"
        fi
        if [ "$expected" != "$actual" ]; then
          echo "::error::forge-ds archive checksum mismatch"
          exit 1
        fi
        tar -xzf "$work/$archive" -C "$work"
        if ! "$work/forge-ds" --version | grep -qF "Commit SHA: $FORGE_DS_REVISION"; then
          echo "::notice::Prebuilt forge-ds is not the pinned revision; building from source"
          exit 0
        fi
        mkdir -p "$HOME/.cargo/bin"
        install -m 0755 "$work/forge-ds" "$HOME/.cargo/bin/forge-ds"
        echo "installed=true" >> "$GITHUB_OUTPUT"

    - name: Setup pinned Rust for forge-ds
      if: steps.forge-ds-cache.outputs.cache-hit != 'true' && steps.prebuilt.outputs.installed != 'true'
      uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
      with:
        toolchain: 1.97.1

    - name: Setup sccache for forge-ds build
      if: steps.forge-ds-cache.outputs.cache-hit != 'true' && steps.prebuilt.outputs.installed != 'true'
      uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba
      with:
        version: v0.17.0

    - name: Build forge-ds from the pinned source revision
      if: steps.forge-ds-cache.outputs.cache-hit != 'true' && steps.prebuilt.outputs.installed != 'true'
      shell: bash
      env:
        RUSTC_WRAPPER: sccache
        SCCACHE_GHA_ENABLED: "true"
      run: cargo +1.97.1 install --git https://github.com/doublesharp/foundry.git --rev 6975c33c48e438d986fe90c7d6c0c5502f1235ed --locked --bin forge-ds --features forge-ds forge

    - name: Verify forge-ds revision
      shell: bash
      run: |
        set -euo pipefail
        echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
        version="$("$HOME/.cargo/bin/forge-ds" --version)"
        printf '%s\n' "$version"
        grep -F "Commit SHA: 6975c33c48e438d986fe90c7d6c0c5502f1235ed" <<<"$version"
